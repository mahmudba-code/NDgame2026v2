<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Majulah Hunt | Student Dashboard</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page-shell">

    <header class="hero compact">
      <p class="eyebrow">CLASS MISSION</p>

      <h1>Crestomon Hunt</h1>

      <p>
        Work with the other teams to complete the class challenge.
      </p>
    </header>

    <section class="panel form-panel">

      <label>
        Class

        <select id="classInput">
          <option value="2-1">2-1</option>
          <option value="2-2">2-2</option>
          <option value="2-3">2-3</option>
          <option value="2-4">2-4</option>
          <option value="2-5">2-5</option>
          <option value="2-6">2-6</option>
          <option value="2-7">2-7</option>
          <option value="2-8">2-8</option>
        </select>
      </label>

      <label>
        Team

        <select id="teamInput">
          <option value="Red">Red</option>
          <option value="Blue">Blue</option>
          <option value="Green">Green</option>
        </select>
      </label>

      <button id="saveIdentity" type="button">
        Save team details
      </button>

    </section>

    <section class="panel">

      <div class="dashboard-heading">

        <div>
          <span class="small-label">
            Shared class progress
          </span>

          <strong>
            <span id="completedCount">0</span>
            /
            <span id="requiredCount">3</span>
          </strong>
        </div>

        <a
          id="liveDisplayLink"
          class="button-link"
          href="display.html?class=2-1"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open live display
        </a>

      </div>

      <div class="progress-track">
        <div
          id="progressBar"
          class="progress-bar"
        ></div>
      </div>

    </section>

    <section class="panel">

      <h2>All clues</h2>

      <p class="muted">
        Find the location first. The QR code at the location
        opens the station question.
      </p>

      <div
        id="clueGrid"
        class="clue-grid"
      ></div>

    </section>

    <p
      id="connectionStatus"
      class="connection-status"
    ></p>

  </main>

  <script src="config.js?v=2"></script>
  <script src="demo-data.js?v=2"></script>
  <script src="hunt.js?v=2"></script>
</body>
</html>
