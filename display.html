<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majulah Hunt | Live Display</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="display-page">
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">NATIONAL DAY 2026</p>
      <h1>Majulah Hunt</h1>
      <p>Restore the National Pledge together</p>
    </header>

    <section class="panel status-panel">
      <div>
        <span class="small-label">Class</span>
        <strong id="className">2-1</strong>
      </div>

      <div>
        <span class="small-label">Stations completed</span>
        <strong>
          <span id="completedCount">0</span> /
          <span id="requiredCount">15</span>
        </strong>
      </div>

      <div>
        <span class="small-label">Points</span>
        <strong>
          <span id="totalPoints">0</span> /
          <span id="targetPoints">61</span>
        </strong>
      </div>
    </section>

    <div class="progress-track">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <section class="panel">
      <div class="score-breakdown">
        <span>
          Station points:
          <strong id="stationPoints">0</strong>
        </span>

        <span>
          Pledge point:
          <strong id="pledgePoint">0</strong>
        </span>
      </div>
    </section>

    <section class="panel pledge-panel">
      <h2>The National Pledge</h2>
      <div id="pledgeLines" class="pledge-lines"></div>
    </section>

    <section class="panel">
      <h2>Station progress</h2>
      <div id="stationGrid" class="station-grid"></div>
    </section>

    <section id="completionBanner" class="completion-banner hidden">
      Mission complete. HAPPY 61st NATIONAL DAY!
    </section>

    <p id="connectionStatus" class="connection-status"></p>
  </main>

  <script src="config.js?v=5"></script>
  <script src="demo-data.js?v=5"></script>
  <script src="display.js?v=5"></script>
</body>
</html>
