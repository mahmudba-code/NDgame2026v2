<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majulah Hunt | Station</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell narrow">
    <header class="hero compact">
      <p class="eyebrow">STATION CHECK</p>
      <h1 id="stationTitle">Loading station…</h1>
    </header>

    <section class="panel">
      <p id="stationQuestion" class="station-question"></p>

      <form id="stationForm" class="stacked-form">
        <label>
          Class
          <select name="className" id="className" required>
          <option value="2-1">2-1</option>
          <option value="2-2">2-2</option>
          <option value="2-3">2-3</option>
          <option value="2-4">2-4</option>
          <option value="2-5">2-5</option>
          <option value="2-6">2-6</option>
          <option value="2-7">2-7</option>
          <option value="2-8">2-8</option>
          </select>
        </label>

        <label>
          Team
          <select name="teamName" id="teamName" required>
            <option value="">Select team</option>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
          </select>
        </label>

        <label>
          Answer
          <input name="answer" autocomplete="off" required>
        </label>

        <button type="submit">Submit answer</button>
      </form>

      <div id="resultMessage" class="result-message"></div>
      <a class="text-link" href="hunt.html">Return to clues</a>
    </section>

    <p id="connectionStatus" class="connection-status"></p>
  </main>

  <script src="config.js"></script>
  <script src="demo-data.js"></script>
  <script src="station.js"></script>
</body>
</html>
